global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]

  - job_name: webapp            # ứng dụng Node.js (prom-client)
    metrics_path: /metrics
    static_configs: [{ targets: ['webapp:3000'] }]

  - job_name: nginx             # Nginx qua exporter
    static_configs: [{ targets: ['nginx-exporter:9113'] }]

  - job_name: mysql             # MySQL qua exporter
    static_configs: [{ targets: ['mysqld-exporter:9104'] }]

  - job_name: cadvisor          # CPU/RAM/Network từng container
    static_configs: [{ targets: ['cadvisor:8080'] }]
