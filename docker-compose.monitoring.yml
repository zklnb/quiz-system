# ===== Commit 2: Prometheus + Grafana + exporters =====
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: quiz-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: quiz-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?thiếu GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    networks: [monitoring]

  # Metrics của Nginx (đọc stub_status)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: quiz-nginx-exporter
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring]

  # Metrics của MySQL (dùng tài khoản exporter quyền tối thiểu)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: quiz-mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD}
    depends_on:
      mysql: { condition: service_healthy }
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring, backend]

  # Metrics của từng container (CPU, RAM, network)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: quiz-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    networks: [monitoring]
