# ===== Nginx reverse proxy (image nginx-unprivileged: chạy non-root) =====
log_format main_kv '$remote_addr - $remote_user [$time_local] "$request" '
                   'status=$status bytes=$body_bytes_sent rt=$request_time ua="$http_user_agent"';
access_log /var/log/nginx/access.log main_kv;

# Giới hạn tốc độ: chống brute-force đăng nhập và flood
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_zone:10m rate=20r/s;
limit_req_status 429;

upstream webapp_upstream {
    server webapp:3000;
    keepalive 16;
}

# HTTP -> HTTPS
server {
    listen 8080;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# HTTPS (chứng chỉ tự ký)
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 1m;

    # ----- Security headers -----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # Không để lộ /metrics ra Internet (Prometheus scrape trực tiếp trong mạng nội bộ)
    location = /metrics { return 404; }

    # Giới hạn tần suất đăng nhập
    location = /login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://webapp_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        limit_req zone=general_zone burst=40 nodelay;
        proxy_pass http://webapp_upstream;
        include /etc/nginx/proxy_params.conf;
    }
}

# Endpoint nội bộ cho nginx-prometheus-exporter (không publish ra host)
server {
    listen 8081;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    location = /stub_status { stub_status; }
}
